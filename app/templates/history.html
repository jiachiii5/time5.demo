{% extends "base.html" %}

{% block content %}
<div class="history-container">
    <h1 class="glow-text text-center" style="margin-bottom: 2rem;">封存紀錄</h1>
    
    <div class="record-grid">
        {% for record in records %}
        <div class="glass-card record-card">
            {% if record.image_path %}
            <div class="record-image" style="background-image: url('{{ record.image_path }}');"></div>
            {% else %}
            <div class="record-image placeholder-image">
                <i data-feather="image"></i>
            </div>
            {% endif %}
            
            <div class="record-content">
                <p class="record-date">{{ record.created_at }}</p>
                <p class="record-text">{{ record.transcribed_text }}</p>
                <div class="record-audio">
                    <audio controls src="{{ url_for('static', filename=record.audio_path) }}"></audio>
                </div>
                <a href="/result/{{ record.id }}" class="btn btn-secondary btn-sm" style="margin-top:1rem;">
                    查看詳情
                </a>
            </div>
        </div>
        {% else %}
        <div class="empty-state text-center" style="grid-column: 1 / -1;">
            <p>目前還沒有任何封存紀錄。</p>
            <a href="/" class="btn btn-primary" style="margin-top: 1rem;">開始第一筆封存</a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
