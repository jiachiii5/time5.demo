{% extends "base.html" %}

{% block content %}
<div class="glass-card text-center recorder-container">
    <h1 class="glow-text">捕捉當下的感官</h1>
    <p class="subtitle">錄製一段聲音，讓 AI 提煉文字並化為視覺記憶。</p>

    <div class="audio-controls">
        <button id="recordBtn" class="btn btn-primary pulse-btn">
            <i data-feather="mic"></i> <span id="recordText">開始錄音</span>
        </button>
        <span class="timer" id="recordingTimer">00:00</span>
    </div>

    <div class="or-divider">或</div>
    
    <div class="upload-section">
        <input type="file" id="audioUpload" accept="audio/*" style="display: none;">
        <label for="audioUpload" class="btn btn-secondary">
            <i data-feather="upload-cloud"></i> 上傳音訊檔
        </label>
        <div id="fileName" class="file-name"></div>
    </div>

    <!--時光膠囊解鎖設定面板-->
    <div class="glass-card unlock-settings-panel" id="unlockSettingsSection" style="display: none; margin-top: 2.5rem; padding: 2rem; text-align: left; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border); border-radius: 16px;">
        <h3 style="margin-top: 0; margin-bottom: 0.8rem; color: var(--text-main); font-size: 1.25rem; display: flex; align-items: center; gap: 8px;">
            <i data-feather="settings" style="color: var(--primary);"></i> 時光膠囊解鎖設定
        </h3>
        <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 1.5rem; line-height: 1.5;">您可以為這顆時光膠囊設定特定的開啟條件。未滿足解鎖條件之前，錄音文字與生成的視覺封存內容將完全處於鎖定與隱藏狀態。</p>
        
        <!-- 選擇器按鈕組 -->
        <div class="unlock-type-selector" style="display: flex; gap: 12px; margin-bottom: 1.5rem;">
            <button type="button" class="btn-select active" data-type="none" style="flex: 1; padding: 14px 10px; border-radius: 12px; border: 1px solid rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.1); color: var(--primary); cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; gap: 6px; outline: none;">
                <i data-feather="unlock" style="width: 20px; height: 20px;"></i>
                <span style="font-size: 0.9rem; font-weight: 600;">立即解鎖</span>
            </button>
            <button type="button" class="btn-select" data-type="geofence" style="flex: 1; padding: 14px 10px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.25); color: var(--text-muted); cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; gap: 6px; outline: none;">
                <i data-feather="map-pin" style="width: 20px; height: 20px;"></i>
                <span style="font-size: 0.9rem; font-weight: 600;">GPS 地圖圍欄</span>
            </button>
            <button type="button" class="btn-select" data-type="random" style="flex: 1; padding: 14px 10px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.25); color: var(--text-muted); cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; gap: 6px; outline: none;">
                <i data-feather="clock" style="width: 20px; height: 20px;"></i>
                <span style="font-size: 0.9rem; font-weight: 600;">隨機遞送演算</span>
            </button>
        </div>

        <!-- GPS 圍欄設定子面板 -->
        <div id="geofenceConfig" class="config-sub-panel" style="display: none; animation: slideDown 0.3s ease-out;">
            <div style="display: flex; flex-direction: column; gap: 12px; background: rgba(0,0,0,0.15); padding: 1.2rem; border-radius: 12px; border: 1px solid var(--glass-border);">
                <div class="form-group-custom">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-main); font-weight: 500;">地標名稱</label>
                    <input type="text" id="locationName" placeholder="例如：台北 101" style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem;">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div style="flex: 1;">
                        <label style="display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-main); font-weight: 500;">緯度 (Latitude)</label>
                        <input type="number" step="any" id="targetLatitude" placeholder="例如：25.0339" style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem;">
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-main); font-weight: 500;">經度 (Longitude)</label>
                        <input type="number" step="any" id="targetLongitude" placeholder="例如：121.5644" style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem;">
                    </div>
                </div>
                <div style="display: flex; gap: 12px; align-items: flex-end;">
                    <div style="flex: 1;">
                        <label style="display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-main); font-weight: 500;">解鎖半徑 (Radius)</label>
                        <select id="targetRadius" style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem;">
                            <option value="50">50 公尺 (超精準圍欄)</option>
                            <option value="100" selected>100 公尺 (標準圍欄)</option>
                            <option value="200">200 公尺 (寬鬆圍欄)</option>
                            <option value="500">500 公尺 (地標周邊範圍)</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-secondary" id="getCurrentLocationBtn" style="padding: 10px 16px; font-size: 0.9rem; border-radius: 8px; white-space: nowrap; height: 43px; display: flex; align-items: center; gap: 6px;">
                        <i data-feather="navigation" style="width: 16px; height: 16px;"></i> 抓取當前 GPS
                    </button>
                </div>
            </div>
        </div>

        <!-- 隨機遞送設定子面板 -->
        <div id="randomConfig" class="config-sub-panel" style="display: none; animation: slideDown 0.3s ease-out;">
            <div style="display: flex; flex-direction: column; gap: 12px; background: rgba(0,0,0,0.15); padding: 1.2rem; border-radius: 12px; border: 1px solid var(--glass-border);">
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-main); font-weight: 500;">選擇遞送時空區間 (系統將於此區間內隨機安排一個降落解鎖時間點)</label>
                    <select id="randomPreset" style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem;">
                        <option value="1-2" selected>⚡ 微幅傳送 (1 ~ 2 小時內隨機解鎖)</option>
                        <option value="12-24">📅 日常傳送 (12 ~ 24 小時內隨機解鎖)</option>
                        <option value="24-72">⏳ 深度傳送 (1 ~ 3 天內隨機解鎖)</option>
                        <option value="custom">⚙️ 自訂時空範圍 (以小時計算)...</option>
                    </select>
                </div>
                <div id="randomCustomInputs" style="display: none; gap: 12px;">
                    <div style="flex: 1;">
                        <label style="display: block; font-size: 0.8rem; margin-bottom: 6px; color: var(--text-muted);">最快解鎖時間 (小時)</label>
                        <input type="number" id="randomMinHours" value="1" min="1" style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem;">
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; font-size: 0.8rem; margin-bottom: 6px; color: var(--text-muted);">最慢解鎖時間 (小時)</label>
                        <input type="number" id="randomMaxHours" value="10" min="2" style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="action-section" style="display: none; margin-top: 2rem;" id="actionSection">
        <button id="submitAudioBtn" class="btn btn-accent" style="padding: 12px 32px; font-size: 1.1rem; border-radius: 12px;">
            <i data-feather="cpu"></i> 開始提煉時光
        </button>
    </div>

    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p id="loadingText">正在提煉聲音中的文字...</p>
    </div>
</div>

<style>
.btn-select:hover {
    background: rgba(255, 255, 255, 0.08) !important;
}
@keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
