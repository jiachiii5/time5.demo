{% extends "base.html" %}

{% block title %}Register - Time5 Collab{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 400px; margin: 4rem auto;">
    <h2 class="text-center mb-4">Create Account</h2>
    <form method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign Up</button>
    </form>
    <div class="text-center mt-4">
        <span class="text-muted">Already have an account?</span> <a href="{{ url_for('login') }}" style="color: var(--accent-color); text-decoration: none;">Log In</a>
    </div>
</div>
{% endblock %}
